[project]
name = "scoring-ifrs9-workspace"
version = "0.1.0"
description = "ECL Calculation (IFRS9) based PD, LGD and EAD models."
readme = "README.md"
requires-python = ">=3.13"
# Un `uv sync` à la racine installe tous les services pour le développement local
dependencies = [
    "scoring-ifrs9",
    "scoring-api",
    "scoring-web",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "statsmodels>=0.14.5,<0.15.0",
    "jupyter>=1.1.1,<2.0.0",
    "matplotlib>=3.10.7,<4.0.0",
    "seaborn>=0.13.2,<0.14.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["pkg", "services/api", "web"]

[tool.uv.sources]
scoring-ifrs9 = { workspace = true }
scoring-api = { workspace = true }
scoring-web = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["pkg/tests", "services/api/tests"]
filterwarnings = [
    # Avertissement interne à fastapi.testclient, sans lien avec notre code
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
